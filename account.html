<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Craigslist</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/form.css">
</head>
<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>
    <div data-include="components/header.html"></div>

    <main class="listing-page account-page">
        
        <div id="auth-section">
            <h1 id="auth-title" style="text-align: center;">Log In</h1>
            <form id="auth-form">
                <div class="form-group login-only">
                    <label for="username" >Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>
                
<!-- Login Password -->
<div class="form-group login-only">
    <label for="password">Password</label>
    <input type="password" id="password"
        placeholder="Enter password" required>

    <!-- Show or hide login password -->
    <label class="show-password-option">
        <input type="checkbox" id="show-login-password">
        <span>Show Password</span>
    </label>
</div>

                <div class="form-group signup-only">
                    <label for="signup-username"> Create Username</label>
                    
                    <input type="text" id="signup-username" placeholder="Enter username"required>
                </div>
                
<!-- Create Password -->
<div class="form-group signup-only">
    <label for="signup-password">Create Password</label>
    <input type="password" id="signup-password"
        placeholder="Enter password"
        autocomplete="new-password"
        aria-describedby="signup-strength-message"
        required>

    <!-- Password strength checker -->
    <div class="signup-strength">
        <div class="signup-strength-bar"
            id="signup-strength-meter"
            role="progressbar"
            aria-label="Password strength"
            aria-valuemin="0"
            aria-valuemax="4"
            aria-valuenow="0">

            <div id="signup-strength-fill"></div>
        </div>

        <p id="signup-strength-message" aria-live="polite">
            Use at least 8 characters.
        </p>
    </div>
</div>
          
<!-- Confirm Password -->
<div class="form-group signup-only">
    <label for="signup-confirm-password">Confirm Password</label>

    <input type="password" id="signup-confirm-password"
        placeholder="Confirm password" required>

    <!-- Show or hide both signup passwords -->
    <label class="show-password-option">
        <input type="checkbox" id="show-signup-passwords">
        <span>Show Passwords</span>
    </label>
</div>

                <div class="form-group signup-only">
                    <label for="signup-email">Enter Email</label>
                    <input type="email" id="signup-email" placeholder="Enter email"required>
                </div>


                <div class="form-actions" style="flex-direction: column; gap: 15px; margin-top: 10px;">
                    <button type="submit" class="post-btn" style="width: 100%;">Submit</button>
                    <a href="#" id="toggle-auth" style="color: var(--logo-color); font-weight: bold; text-decoration: none; text-align: center;">Need an account? Sign up</a>
                </div>
                <p id="auth-message" style="color: #ff4444; margin-top: 15px; text-align: center; font-weight: bold;"></p>
            </form>
        </div>

<!-- Account Dashboard -->
<div id="dashboard-section" style="display: none;">

    <div class="account-heading">
        <h1>My Account</h1>
        <p>Welcome, <span id="display-username"></span>!</p>
    </div>

    <div class="account-layout">

        <!-- Account Menu -->
        <nav class="account-menu" aria-label="Account menu">
            <button type="button" class="account-tab active"
                data-panel="listings-panel">My Listings</button>

            <button type="button" class="account-tab"
                data-panel="favorites-panel">Favorites</button>

            <button type="button" class="account-tab"
                data-panel="details-panel">Account Details</button>

            <button type="button" class="account-tab"
                data-panel="settings-panel">Settings</button>

            <a href="formPage.html" class="account-link">
                + Create Listing
            </a>

            <button type="button" id="logout-btn"
                class="account-tab">Log Out</button>
        </nav>

        <!-- Right Side of the Account Page -->
        <div class="account-content">

            <!-- My Listings -->
            <section id="listings-panel" class="account-panel">
                <h2>My Listings</h2>
                <p>View the items you have posted.</p>
                <div id="my-listings"></div>
            </section>

            <!-- Favorites -->
            <section id="favorites-panel" class="account-panel" hidden>
                <h2>Favorites</h2>
                <p>Items you have saved for later.</p>
                <div id="my-favorites"></div>
            </section>

            <!-- Account Details -->
            <section id="details-panel" class="account-panel" hidden>
                <h2>Account Details</h2>
                <p>Update your account information below.</p>

                <!-- We check these fields with JavaScript -->
                <form id="account-details-form" novalidate>

                    <div class="form-group">
                        <label for="profile-name">Full Name *</label>
                        <input type="text" id="profile-name"
                            placeholder="Enter your full name"
                            aria-describedby="profile-name-feedback"
                            required>
                        <p id="profile-name-feedback"
                            class="account-feedback"></p>
                    </div>

                    <div class="form-group">
                        <label for="profile-email">Email *</label>
                        <input type="email" id="profile-email"
                            placeholder="name@example.com"
                            aria-describedby="profile-email-feedback"
                            required>
                        <p id="profile-email-feedback"
                            class="account-feedback"></p>
                    </div>

                    <div class="form-group">
                        <label for="profile-phone">Phone Number *</label>
                        <input type="tel" id="profile-phone"
                            placeholder="555-123-4567"
                            aria-describedby="profile-phone-feedback"
                            required>
                        <p id="profile-phone-feedback"
                            class="account-feedback"></p>
                    </div>

                    <button type="submit" class="post-btn">
                        Save Changes
                    </button>

                    <p id="details-message" role="status"></p>
                </form>
            </section>

            <!-- Settings -->
            <section id="settings-panel" class="account-panel" hidden>
                <h2>Settings</h2>
                <p>Change how the website looks.</p>

                <label class="account-setting-label">
                    <input type="checkbox" id="account-dark-mode">
                    Enable Dark Mode
                </label>
            </section>

        </div>
    </div>
</div>


    </main>

    <script src="js/HTMLInclude.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
