<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - Craigslist</title>
</head>

<!--kacey is working on this right now-->

<body>
    <header class="listing-header">

        <!-- Hamburger Menu -->
        <button class="hamburger" id="hamburger-btn"
                aria-label="Open menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Craigslist Logo -->
        <a href="index.html" class="listing-logo">
            <svg class="peace-icon" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45"
                        stroke="currentColor" stroke-width="5"
                        fill="none"/>
                <line x1="50" y1="5" x2="50" y2="95"
                    stroke="currentColor" stroke-width="5"/>
                <line x1="50" y1="50" x2="15" y2="85"
                    stroke="currentColor" stroke-width="5"/>
                <line x1="50" y1="50" x2="85" y2="85"
                    stroke="currentColor" stroke-width="5"/>
            </svg>
            <span>CL</span>
        </a>

        <main class="results-page">
            <h1>Search Results</h1>
            <div class="search-controls">
                <label for="sort-options">Reorder results:</label>
                <select id="sort-options" name="sort-options">
                    <option value="relevance">Relevance</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="date-newest">Newest</option>
                    <option value="date-oldest">Oldest</option>
                </select>
            </div>
            <ul class="item-listings">
                <li class="item">
                    <h2>Item 1</h2>
                    <p>Description for item 1</p>
                    <span class="price">$10</span>
                </li>
                <li class="item">
                    <h2>Item 2</h2>
                    <p>Description for item 2</p>
                    <span class="price">$20</span>
                </li>
                <li class="item">
                    <h2>Item 3</h2>
                    <p>Description for item 3</p>
                    <span class="price">$30</span>
                </li>
                <!-- Add more items as needed -->
            </ul>
            <div class="search-results">
                <!-- Search results will be dynamically inserted here -->
            </div>

    <script src="js/script.js"></script>
    <script src="js/form.js"></script>
</body>
</html>
