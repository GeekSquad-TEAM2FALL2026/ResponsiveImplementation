<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - Craigslist</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>
    <div data-include="components/header.html"></div>
    
    <main class="results-page">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h1>Search Results</h1>
            <div class="search-controls">
                <select id="sort-options" name="sort-options" style="padding: 0.5rem; border-radius: 4px; background: var(--secondary-color); color: var(--text-color); border: none;">
                    <option value="featured">Featured</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="date-newest">Newest</option>
                    <option value="date-oldest">Oldest</option>
                </select>
            </div>
        </div>

        <ul class="item-listings">
            <li class="item" onclick="window.location.href='listing.html'">
                <div class="item-image-wrapper">
                    <img src="images/Theremin1.jpg" alt="Moog Theremin">
                </div>
                <div class="item-info">
                    <span class="price">$800</span>
                    <h2 class="item-title">Moog Theremin</h2>
                    <div class="item-meta-row">
                        <span class="item-location">Charlotte, NC</span>
                        <span class="item-date">Nov 10, 9:48 PM</span>
                    </div>
                    
                    <span style="display: none;" class="search-category">for-sale</span>
                    <span style="display: none;" class="search-tags">musical-instruments</span>
                </div>
            </li>
        </ul>
        <div class="search-results">
        </div>
    </main>

    <script src="js/HTMLInclude.min.js"></script>
    <script src="js/seedData.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
