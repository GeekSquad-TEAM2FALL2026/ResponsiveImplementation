<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craigslist Prototype</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="has-hero-search">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div data-include="components/header.html"></div>

    <main class="center-content">
        <div class="logo-container">
            <svg class="peace-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" stroke="var(--logo-color)" stroke-width="5" fill="none" />
                <line x1="50" y1="5" x2="50" y2="95" stroke="var(--logo-color)" stroke-width="5" />
                <line x1="50" y1="50" x2="15" y2="85" stroke="var(--logo-color)" stroke-width="5" />
                <line x1="50" y1="50" x2="85" y2="85" stroke="var(--logo-color)" stroke-width="5" />
            </svg>
            <h1 class="logo-text">Craigslist</h1>
        </div>

        <div class="search-container js-search-container" id="search-container">
            <input type="text" class="search-input js-search-input" id="search-input" placeholder="Search"
                autocomplete="off">
            <ul class="dropdown-menu js-search-dropdown" id="search-dropdown">
                <li>Option 1</li>
                <li>Option 2</li>
                <li>Option 3</li>
            </ul>
        </div>

        <div class="action-buttons">
            <a href="formPage.html" class="btn"
                style="text-decoration: none; text-align: center; display: flex; align-items: center; justify-content: center;">Create
                Listing</a>
        </div>
    </main>

    <script src="js/HTMLInclude.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
