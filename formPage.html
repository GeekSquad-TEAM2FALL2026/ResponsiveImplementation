<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Listing - Craigslist</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/form.css">
</head>

<body>
    <header class="listing-header">

        <!-- Hamburger Menu -->
        <button class="hamburger" id="hamburger-btn"
                aria-label="Open menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Craigslist Logo -->
        <a href="index.html" class="listing-logo">
            <svg class="peace-icon" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45"
                        stroke="currentColor" stroke-width="5"
                        fill="none"/>
                <line x1="50" y1="5" x2="50" y2="95"
                    stroke="currentColor" stroke-width="5"/>
                <line x1="50" y1="50" x2="15" y2="85"
                    stroke="currentColor" stroke-width="5"/>
                <line x1="50" y1="50" x2="85" y2="85"
                    stroke="currentColor" stroke-width="5"/>
            </svg>
            <span>CL</span>
        </a>

        <!-- Navigation -->
        <nav id="nav-menu" class="nav-menu">
            <ul>
                <li><a href="index.html">Home</a></li>

                <li class="nav-dropdown-container">
                    <a href="#" id="categories-btn">
                        Categories <span id="cat-arrow">▼</span>
                    </a>

                    <ul class="dropdown-menu categories-list"
                        id="categories-dropdown">
                        <li>Community</li>
                        <li>Services</li>
                        <li>For Sale</li>
                        <li>Housing</li>
                        <li>Autos</li>
                        <li>Jobs</li>
                        <li>Gigs</li>
                        <li>Discussion Forums</li>
                        <li>Resumes</li>
                    </ul>
                </li>

                <li>
                    <a href="formPage.html" aria-current="page">Post</a>
                </li>
                <li><a href="index.html">Account</a></li>
            </ul>
        </nav>

        <!-- Search Bar -->
        <div class="search-container listing-search">
            <input type="text" class="search-input"
                id="search-input" placeholder="Search"
                autocomplete="off">

            <ul class="dropdown-menu" id="search-dropdown">
                <li>Option 1</li>
                <li>Option 2</li>
                <li>Option 3</li>
            </ul>
        </div>

        <!-- Dark Mode Toggle -->
        <div class="theme-toggle">
            <input type="checkbox" id="theme-switch"
                class="theme-switch">

            <label for="theme-switch" class="switch-label">
                <span class="theme-icon"></span>
            </label>
        </div>

    </header>

    <!-- Create Listing Form -->
    <main class="listing-page">

        <h1>Create a Listing</h1>

        <form id="listing-form">

            <!-- Listing Title -->
            <div class="form-group">
                <label for="listing-title">Listing Title *</label>
                <input type="text" id="listing-title"
                    placeholder="Enter listing title..."
                    required>
            </div>

            <!-- Category and Price -->
            <div class="form-row">

                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" required>
                        <option value="">Select category</option>
                        <option value="for-sale">For Sale</option>
                        <option value="housing">Housing</option>
                        <option value="services">Services</option>
                        <option value="jobs">Jobs</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="price">Price *</label>
                    <input type="number" id="price"
                        placeholder="Enter price..."
                        min="0" required>
                </div>

            </div>

            <!-- Location -->
            <div class="form-group">
                <label for="location">Location *</label>
                <input type="text" id="location"
                    value="Charlotte, NC" required>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label for="description">Description *</label>
                <textarea id="description" rows="5"
                        placeholder="Describe your listing..."
                        required></textarea>
            </div>

            <!-- Add Photos -->
            <div class="form-group">
                <label for="photos">Add Photos</label>

                <div class="photo-container">
                    <label for="photos" class="photo-box">+</label>
                    <label for="photos" class="photo-box">+</label>
                    <label for="photos" class="photo-box">+</label>
                </div>

                <input type="file" id="photos"
                    accept="image/*" multiple hidden>
                <p id="photo-message"></p>
            </div>

            <!-- Buttons -->
            <div class="form-actions">
                <a href="index.html" class="cancel-btn">Cancel</a>

                <button type="submit" class="post-btn">
                    Post Listing
                </button>
            </div>

            <!-- Confirmation Message -->
            <p id="form-message" role="status"></p>

        </form>

    </main>

    <script src="js/script.js"></script>
    <script src="js/form.js"></script>

</body>
</html>
