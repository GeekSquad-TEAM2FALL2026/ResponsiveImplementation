<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Listing - Craigslist</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/form.css">
    <link rel="stylesheet" href="css/loading.css">
</head>

<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>
    <div data-include="components/header.html"></div>

    <!-- Create Listing Form -->
    <main class="listing-page">

        <h1>Create a Listing</h1>

        <form id="listing-form">

            <!-- Listing Title -->
            <div class="form-group">
                <label for="listing-title">Listing Title *</label>
                <input type="text" id="listing-title"
                    placeholder="Enter listing title..."
                    required>
            </div>

            <!-- Category and Price -->
            <div class="form-row">

                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" required>
                        <option value="">Select category</option>
                        <option value="for-sale">For Sale</option>
                        <option value="housing">Housing</option>
                        <option value="services">Services</option>
                        <option value="jobs">Jobs</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="price">Price *</label>
                    <input type="number" id="price"
                        placeholder="Enter price..."
                        min="0" required>
                </div>

            </div>

            <!-- Subcategory -->
            <div class="form-group">
                <label for="subcategory">Subcategory *</label>
                <select id="subcategory" required>
                    <option value="">Select a subcategory...</option>
                </select>
            </div>
                    <!-- <option value="">Select a subcategory...</option>
                    <option value="musical-instruments">Musical Instruments</option>
                    <option value="electronics">Electronics</option>
                    <option value="furniture">Furniture</option>
                    <option value="tools">Tools</option>
                    <option value="clothing">Clothing</option>
                    <option value="toys">Toys</option>
                    <option value="sports">Sports</option>
                    <option value="automotive">Automotive</option>
                    <option value="books">Books</option>
                    <option value="movies">Movies</option>
                    <option value="music">Music</option>
                    <option value="other">Other</option> -->

            <!-- Location -->
            <div class="form-group">
                <label for="location">Location *</label>
                <input type="text" id="location"
                    value="Charlotte, NC" required>
            </div>

            <!-- Tags -->
            <div class="form-group">
                <label for="tags">Tags / Badges (comma-separated)</label>
                <input type="text" id="tags" placeholder="e.g., Condition: Excellent, Make: Moog, Vintage">
            </div>

            <!-- Description -->
            <div class="form-group">
                <label for="description">Description *</label>
                <textarea id="description" rows="5"
                        placeholder="Describe your listing..."
                        required></textarea>
            </div>

            <!-- Add Photos -->
            <div class="form-group"> 
                <label for="photos" style="width: 100%; text-align: left;">Add Photos (Max 10)</label>

                <div class="photo-container" id="image-preview-container" style="display: flex; gap: 12px; flex-wrap: wrap; width: 100%;">
                    
                    <label for="photos" class="photo-box" id="upload-trigger-box">+</label>
                    
                </div>

                <input type="file" id="photos" accept="image/*" multiple hidden>
                <p id="photo-message" style="width: 100%; text-align: left; color: #ff4444; margin-top: 4px; font-weight: bold;"></p>
            </div>

            <!-- Buttons -->
            <div class="form-actions">
                <a href="index.html" class="cancel-btn">Cancel</a>

                <button type="submit" class="post-btn">
                    Post Listing
                </button>
            </div>

            <!-- Confirmation Message -->
            <p id="form-message" role="status"></p>

        </form>

    </main>

    <script src="js/HTMLInclude.min.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
